<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6b78"/>
    </marker>
  </defs>

  <rect width="1000" height="720" fill="#ffffff"/>

  <text x="40" y="44" font-size="21" font-weight="700" fill="#14202b">ShopSphere — Production Architecture</text>
  <text x="40" y="66" font-size="12.5" fill="#5a6b78">Student ID 30903180103559 · deployment as delivered in Task 1</text>

  <!-- Clients -->
  <rect x="60" y="96" width="240" height="66" rx="8" fill="#f6f1e9" stroke="#9a7b4f" stroke-width="1.5"/>
  <text x="180" y="126" font-size="14.5" font-weight="600" fill="#14202b" text-anchor="middle">User's Browser</text>
  <text x="180" y="146" font-size="11.5" fill="#5a6b78" text-anchor="middle">React SPA · English / Arabic</text>

  <rect x="700" y="96" width="240" height="66" rx="8" fill="#fdf0ef" stroke="#b04a44" stroke-width="1.5"/>
  <text x="820" y="126" font-size="14.5" font-weight="600" fill="#14202b" text-anchor="middle">UptimeRobot</text>
  <text x="820" y="146" font-size="11.5" fill="#5a6b78" text-anchor="middle">polls every 5 minutes</text>

  <!-- Vercel platform -->
  <rect x="50" y="240" width="900" height="176" rx="10" fill="#f4f7f9" stroke="#c8d4dc" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="70" y="266" font-size="12" font-weight="700" fill="#5a6b78" letter-spacing="1.4">VERCEL · PaaS · HTTPS TERMINATED AT EDGE</text>

  <rect x="80" y="286" width="370" height="106" rx="8" fill="#e8f2fb" stroke="#2f6fa8" stroke-width="1.8"/>
  <text x="265" y="315" font-size="15" font-weight="600" fill="#14202b" text-anchor="middle">Frontend — static build</text>
  <text x="265" y="337" font-size="11.5" fill="#2f6fa8" text-anchor="middle" font-family="Consolas, monospace">shopsphere-storefront.vercel.app</text>
  <text x="265" y="359" font-size="11.5" fill="#5a6b78" text-anchor="middle">React 19 + Vite · served from CDN</text>
  <text x="265" y="378" font-size="11.5" fill="#5a6b78" text-anchor="middle">SPA rewrites via vercel.json</text>

  <rect x="550" y="286" width="370" height="106" rx="8" fill="#e6f4f1" stroke="#1f7a6b" stroke-width="1.8"/>
  <text x="735" y="315" font-size="15" font-weight="600" fill="#14202b" text-anchor="middle">Backend — serverless function</text>
  <text x="735" y="337" font-size="11.5" fill="#1f7a6b" text-anchor="middle" font-family="Consolas, monospace">shopsphere-store-api.vercel.app</text>
  <text x="735" y="359" font-size="11.5" fill="#5a6b78" text-anchor="middle">Express 5 · Helmet · CORS · rate limiting</text>
  <text x="735" y="378" font-size="11.5" fill="#5a6b78" text-anchor="middle">secrets held as environment variables</text>

  <!-- Databases -->
  <rect x="80" y="510" width="370" height="118" rx="8" fill="#e8f5ec" stroke="#2e7d4f" stroke-width="1.8"/>
  <text x="265" y="539" font-size="15" font-weight="600" fill="#14202b" text-anchor="middle">Supabase — PostgreSQL</text>
  <text x="265" y="560" font-size="11.5" fill="#2e7d4f" text-anchor="middle" font-family="Consolas, monospace">eu-central-1 · pooler :6543</text>
  <text x="265" y="582" font-size="11.5" fill="#5a6b78" text-anchor="middle">User · Category · Product · ProductImage</text>
  <text x="265" y="600" font-size="11.5" fill="#5a6b78" text-anchor="middle">Cart · CartItem · Order · OrderItem</text>
  <text x="265" y="618" font-size="11.5" fill="#5a6b78" text-anchor="middle">Prisma ORM · row level security enabled</text>

  <rect x="550" y="510" width="370" height="118" rx="8" fill="#eaf3e9" stroke="#4a7c3f" stroke-width="1.8"/>
  <text x="735" y="539" font-size="15" font-weight="600" fill="#14202b" text-anchor="middle">MongoDB Atlas</text>
  <text x="735" y="560" font-size="11.5" fill="#4a7c3f" text-anchor="middle" font-family="Consolas, monospace">us-east-1 · M0 · mongodb+srv</text>
  <text x="735" y="582" font-size="11.5" fill="#5a6b78" text-anchor="middle">reviews · activitylogs</text>
  <text x="735" y="600" font-size="11.5" fill="#5a6b78" text-anchor="middle">Mongoose ODM</text>
  <text x="735" y="618" font-size="11.5" fill="#5a6b78" text-anchor="middle">connected per warm instance</text>

  <!-- Traffic path -->
  <path d="M 180 162 L 180 286" stroke="#5a6b78" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <text x="190" y="205" font-size="11" fill="#14202b" font-weight="600">1 · HTTPS</text>
  <text x="190" y="221" font-size="10.5" fill="#5a6b78">loads the SPA</text>

  <path d="M 300 129 L 620 129 L 620 286" stroke="#5a6b78" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <text x="330" y="122" font-size="11" fill="#14202b" font-weight="600">2 · HTTPS + CORS</text>
  <text x="330" y="138" font-size="10.5" fill="#5a6b78">XHR from the browser to /api/*</text>

  <path d="M 820 162 L 820 286" stroke="#b04a44" stroke-width="1.8" fill="none" marker-end="url(#ar)" stroke-dasharray="5 3"/>
  <text x="830" y="205" font-size="11" fill="#b04a44" font-weight="600">3 · GET /api/health</text>
  <text x="830" y="221" font-size="10.5" fill="#5a6b78">also keeps Supabase awake</text>

  <path d="M 640 392 L 400 392 L 400 510" stroke="#5a6b78" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <text x="410" y="450" font-size="11" fill="#14202b" font-weight="600">4 · TLS · Postgres wire</text>
  <text x="410" y="466" font-size="10.5" fill="#5a6b78">reads and writes commerce data</text>

  <path d="M 800 392 L 800 510" stroke="#5a6b78" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <text x="812" y="450" font-size="11" fill="#14202b" font-weight="600">5 · TLS · mongodb+srv</text>
  <text x="812" y="466" font-size="10.5" fill="#5a6b78">reviews and activity logs</text>

  <text x="50" y="682" font-size="11" fill="#5a6b78">Traffic path: the browser loads the static build from Vercel's CDN (1), then calls the API directly over HTTPS with CORS restricted to the storefront origin (2).</text>
  <text x="50" y="700" font-size="11" fill="#5a6b78">The API reaches Supabase through the transaction pooler (4) and Atlas over TLS (5). UptimeRobot polls the health endpoint independently of user traffic (3).</text>
</svg>
